[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-sed-toolkit"
version = "0.1.0"
description = "Gaia DR3 spectral energy distribution tooling for photometry, model fitting, and plotting."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "gaia-sed-toolkit contributors" }]
keywords = ["astronomy", "gaia", "sed", "spectral-energy-distribution", "astrophysics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "astropy>=5.3",
  "astroquery>=0.4.7",
  "dust-extinction>=1.4",
  "gaiaxpy>=2.1",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.4",
  "twine>=5.0",
]
docs = [
  "jupyter>=1.0",
]

[project.scripts]
general-sed = "general_sed.cli:main"
gaia-sed-toolkit = "general_sed.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
general_sed = [
  "data/model_photometry/bt-nextgen-agss2009_phot_1587193332.0893/*.dat",
  "data/examples/*.csv",
]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
